services:
  test-target:
    build:
      context: ./services/test-target
      dockerfile: Dockerfile
    container_name: netreplay-test-target
    restart: unless-stopped
    ports:
      - "127.0.0.1:${TEST_TARGET_PORT:-3000}:3000"
    environment:
      - PORT=3000
      - HOST=0.0.0.0
      - NODE_ENV=production
    networks:
      - netreplay-network
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 3s

  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:2.12.0
    container_name: netreplay-toxiproxy
    restart: unless-stopped
    ports:
      # Toxiproxy Control API bound strictly to localhost loopback (NEVER exposed to 0.0.0.0)
      - "127.0.0.1:${TOXIPROXY_CONTROL_PORT:-8474}:8474"
      # Proxied listener bound to localhost loopback for fault-injected testing
      - "127.0.0.1:${TOXIPROXY_LISTEN_PORT:-8666}:8666"
    networks:
      - netreplay-network
    depends_on:
      test-target:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: netreplay-api
    restart: unless-stopped
    ports:
      - "127.0.0.1:${API_PORT:-3100}:3100"
    environment:
      - NODE_ENV=production
      - API_PORT=3100
      - API_HOST=0.0.0.0
      - TOXIPROXY_CONTROL_URL=http://toxiproxy:8474
      - TOXIPROXY_PROXY_NAME=netreplay-demo
      - TEST_TARGET_DIRECT_URL=http://test-target:3000
      - TEST_TARGET_PROXY_URL=http://toxiproxy:8666
      - DATABASE_URL=file:/app/apps/api/data/netreplay.db
      - CORS_ORIGINS=http://localhost:5173,http://127.0.0.1:5173
      - LOG_LEVEL=${LOG_LEVEL:-info}
    volumes:
      - api-data:/app/apps/api/data
    networks:
      - netreplay-network
    depends_on:
      test-target:
        condition: service_healthy
      toxiproxy:
        condition: service_started
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3100/health').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        - VITE_API_BASE_URL=http://127.0.0.1:3100
    container_name: netreplay-web
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WEB_PORT:-5173}:5173"
    networks:
      - netreplay-network
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:5173/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 3s

volumes:
  api-data:
    name: netreplay-api-data

networks:
  netreplay-network:
    name: netreplay-network
    driver: bridge
